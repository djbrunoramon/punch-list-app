<header class="header">
  <a class="brand" routerLink="/">Punch List</a>

  <nav class="nav" aria-label="Main">
    @for (link of links; track link.path) {
      <a
        tuiButton
        size="s"
        appearance="flat"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: link.exact }"
        [routerLink]="link.path"
        >{{ link.label }}</a
      >
    }
  </nav>

  <div class="contract-selector">
    @if (context.contracts.isLoading()) {
      <tui-loader size="s" />
    } @else if (context.contracts.error()) {
      <span class="selector-error" role="status">Contracts unavailable</span>
      <button tuiButton type="button" size="s" appearance="secondary" (click)="context.reload()">
        Retry
      </button>
    } @else if (context.contracts.hasValue() && context.contracts.value().length) {
      <tui-textfield tuiTextfieldSize="s" [stringify]="stringify" [identityMatcher]="sameContract">
        <label tuiLabel for="contract-selector">Contract</label>
        <select
          id="contract-selector"
          tuiSelect
          data-testid="contract-selector"
          [formField]="selection"
          [items]="context.contracts.value()"
        ></select>
      </tui-textfield>
    } @else {
      <a tuiButton size="s" appearance="secondary" routerLink="/contracts/new">Add a contract</a>
    }
  </div>
</header>

<main class="main">
  <router-outlet />
</main>
