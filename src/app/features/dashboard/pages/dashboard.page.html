<header class="page-header">
  <h1 class="tui-text_h4">Dashboard</h1>
</header>

@if (contractsError()) {
  <app-page-state [error]="contractsError()" (retry)="reloadContracts()" />
} @else if (contractId() === null && !contractsLoading()) {
  <tui-block-status data-testid="no-contract">
    <h4>Select a contract to see its dashboard</h4>
    <a tuiButton size="s" appearance="secondary" routerLink="/contracts/new">Add a contract</a>
  </tui-block-status>
} @else {
  <app-page-state
    [loading]="contractsLoading() || byStatus.isLoading()"
    [error]="byStatus.error()"
    [empty]="total() === 0"
    emptyText="No pendencies yet"
    (retry)="byStatus.reload()"
  >
    <div class="charts">
      <section class="chart" aria-labelledby="status-title" data-testid="status-chart">
        <h2 id="status-title" class="tui-text_h5">By status</h2>
        <tui-pie-chart size="l" [value]="statusValues()" />
        <ul class="legend" data-testid="status-legend">
          @for (item of statusCounts(); track item.label; let i = $index) {
            <li>
              <tui-legend-item
                [color]="'var(--tui-chart-categorical-0' + i + ')'"
                [text]="item.label + ' (' + item.quantity + ')'"
              />
            </li>
          }
        </ul>
      </section>

      <section class="chart" aria-labelledby="priority-title">
        <h2 id="priority-title" class="tui-text_h5">By priority</h2>
        <tui-textfield class="filter" tuiTextfieldSize="s">
          <label tuiLabel for="status-filter">Status</label>
          <select id="status-filter" tuiSelect [formField]="filter" [items]="statuses"></select>
        </tui-textfield>

        <app-page-state
          [loading]="byPriority.isLoading()"
          [error]="byPriority.error()"
          [empty]="priorityCounts().length === 0"
          emptyText="No pendencies with this status"
          (retry)="byPriority.reload()"
        >
          <div
            class="bars"
            role="img"
            data-testid="priority-chart"
            [attr.aria-label]="priorityDescription()"
          >
            <tui-axes
              class="axes"
              [axisXLabels]="priorityLabels()"
              [axisYLabels]="priorityAxis()"
              [horizontalLines]="2"
              [centeredXLabels]="true"
            >
              <tui-bar-chart [size]="null" [max]="priorityMax()" [value]="priorityValues()" />
            </tui-axes>
          </div>
        </app-page-state>
      </section>
    </div>
  </app-page-state>
}
